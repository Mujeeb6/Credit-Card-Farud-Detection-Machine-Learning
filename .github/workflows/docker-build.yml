name: CI Pipeline - Fraud Detection Build

# Trigger the pipeline every time you push code to the 'main' branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Grab your code from GitHub
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Set up the Docker build environment
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 3. Build the Docker image (and load it locally for the next step)
    - name: Build Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false 
        load: true 
        tags: fraud-detection-app:latest

    # 4. Verify the image built successfully
    - name: Verify Docker Image
      run: docker image ls | grep fraud-detection-app